[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    bblanchon/ArduinoJson@7.4.3
build_flags = -D ROADLINK_OLED=0
build_src_filter = +<main.cpp> -<tft_main.cpp>

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1

[env:esp32-oled]
board = esp32dev
build_flags = -D ROADLINK_OLED=1
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2@2.36.18

[env:esp32-s3-tft]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags = -D ROADLINK_TFT=1 -DBOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.0
build_src_filter = +<tft_main.cpp> -<main.cpp>

[env:esp32-s3-round]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags = -D ROADLINK_TFT=1 -D ROADLINK_ROUND=1 -DBOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.0
build_src_filter = +<tft_main.cpp> -<main.cpp>
